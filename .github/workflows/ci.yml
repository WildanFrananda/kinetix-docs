name: CI

# This repository is public and so is everything it builds. A red `leaks` job means a page or
# asset holds something that belongs in kinetix-docs-internal; fix it by moving the content, not
# by widening a rule. The matched text is never printed, because Actions logs here are public too.

# Every action is pinned to a commit, with its release in a comment for Dependabot: a tag can be
# moved to other code, and the deploy job holds the token that publishes this site.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Starlight reads each page's last-updated date from git history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Astro runs on Node, not Bun. Without this it gets the runner image's Node, which moves on its
      # own: Astro 7.4 refused the runner's 22.23.3 (it needs 22.23.4 or later) on 2026-10-26.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      # The Verify page's WebAssembly verifier, a notary release asset pinned by SHA-256 in
      # src/site/notary_verifier.ts; the tests load and run it.
      - run: bun run fetch:verifier
      - run: bun test
      - run: bun run check:translations
      - run: bun run build
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}

  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # A fork's pull request is given no secrets, and neither is Dependabot's (it reads Dependabot
      # secrets only), so only there may the list be empty. Dependabot changes package.json and the
      # lockfile, never a page, so it has nothing the list could catch.
      - name: Require the denylist
        if: >-
          github.event_name == 'push'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.event.pull_request.user.login != 'dependabot[bot]')
        run: test -n "$DOCS_DENYLIST" || { echo "the DOCS_DENYLIST secret is missing or empty"; exit 1; }
        env:
          DOCS_DENYLIST: ${{ secrets.DOCS_DENYLIST }}
      # Concrete values (hostnames, addresses, bucket names) live in a secret, one per line, so
      # the list of what must not be published is not itself published.
      - run: bun run check:leaks
        env:
          DOCS_DENYLIST: ${{ secrets.DOCS_DENYLIST }}
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Vercel's own Git integration is switched off in vercel.json: it deploys on push without waiting
  # for this workflow, so a page that fails `leaks` would already be public. Production is deployed
  # from here, and only after both jobs pass.
  deploy:
    needs: [verify, leaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: bun install --frozen-lockfile
      - run: bunx vercel@59.26.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: bunx vercel@59.26.0 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      - run: bunx vercel@59.26.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
