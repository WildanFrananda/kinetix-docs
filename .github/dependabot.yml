version: 2
updates:
  - package-ecosystem: bun
    directories:
      - "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # `astro check` refuses TypeScript 7 ("does not currently support TypeScript 7.0. ... install
    # TypeScript 6 instead"). Lift this when Astro supports it.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directories:
      - "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(actions)"
